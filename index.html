<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title></title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        h1, h2 { color: #333; }
        .section { margin-bottom: 30px; }
        label { display: inline-block; width: 120px; }
        input { width: 80px; margin-bottom: 5px; }
        button { margin-top: 10px; }
        .result { margin-top: 5px; font-weight: bold; color: #0055aa; }
    </style>
</head>
<body>
    <h1></h1>

    <!-- 1) Coin Total -->
    <div class="section">
        <h2>1) Coin Total</h2>
        <label>Nickels:</label><input type="number" id="nickels" value="0"><br>
        <label>Dimes:</label><input type="number" id="dimes" value="0"><br>
        <label>Quarters:</label><input type="number" id="quarters" value="0"><br>
        <label>Loonies:</label><input type="number" id="loonies" value="0"><br>
        <label>Toonies:</label><input type="number" id="toonies" value="0"><br>
        <button onclick="calculateCoins()">Calculate Total</button>
        <div class="result" id="coinResult"></div>
    </div>

    <!-- 2) Fahrenheit to Celsius -->
    <div class="section">
        <h2>2) Fahrenheit to Celsius</h2>
        <label>Fahrenheit:</label><input type="number" id="fahrenheit" value="70"><br>
        <button onclick="convertFtoC()">Convert</button>
        <div class="result" id="tempResult"></div>
    </div>

    <!-- 3) Cube Volume -->
    <div class="section">
        <h2>3) Cube Volume</h2>
        <label>Height (m):</label><input type="number" id="cubeHeight" value="1"><br>
        <button onclick="calculateCube()">Calculate Volume</button>
        <div class="result" id="cubeResult"></div>
    </div>

    <!-- 4) Gym Membership Cost -->
    <div class="section">
        <h2>4) Gym Membership Cost</h2>
        <label>Base Cost ($):</label><input type="number" id="gymCost" value="100"><br>
        <label>Friends:</label><input type="number" id="gymFriends" value="0"><br>
        <button onclick="calculateGym()">Calculate Total</button>
        <div class="result" id="gymResult"></div>
    </div>

    <!-- 5) Earthquake Damage -->
    <div class="section">
        <h2>5) Earthquake Damage</h2>
        <label>Richter Scale:</label><input type="number" step="0.1" id="quakeIntensity" value="5"><br>
        <button onclick="calculateDamage()">Check Damage</button>
        <div class="result" id="quakeResult"></div>
    </div>

    <script>
        // 1) Coin Total
        function coinTotal(nickels, dimes, quarters, loonies, toonies) {
            return nickels * 0.05 + dimes * 0.10 + quarters * 0.25 + loonies * 1 + toonies * 2;
        }
        function calculateCoins() {
            const total = coinTotal(
                parseInt(document.getElementById('nickels').value),
                parseInt(document.getElementById('dimes').value),
                parseInt(document.getElementById('quarters').value),
                parseInt(document.getElementById('loonies').value),
                parseInt(document.getElementById('toonies').value)
            );
            document.getElementById('coinResult').textContent = `Total: $${total.toFixed(2)}`;
        }

        // 2) Fahrenheit to Celsius
        function fahrenheitToCelsius(f) {
            return (f - 32) * 5 / 9;
        }
        function convertFtoC() {
            const f = parseFloat(document.getElementById('fahrenheit').value);
            const c = fahrenheitToCelsius(f);
            document.getElementById('tempResult').textContent = `${f}°F = ${c.toFixed(2)}°C`;
        }

        // 3) Cube Volume
        function cubeVolume(height) {
            return Math.pow(height, 3);
        }
        function calculateCube() {
            const h = parseFloat(document.getElementById('cubeHeight').value);
            const volume = cubeVolume(h);
            document.getElementById('cubeResult').textContent = `Volume: ${volume.toFixed(2)} m³`;
        }

        // 4) Gym Membership Cost
        function gymMembershipCost(cost, friends) {
            let discount = 0;
            if (friends === 1) discount = 0.05;
            else if (friends === 2) discount = 0.10;
            else if (friends >= 3) discount = 0.15;
            return cost * (1 - discount);
        }
        function calculateGym() {
            const cost = parseFloat(document.getElementById('gymCost').value);
            const friends = parseInt(document.getElementById('gymFriends').value);
            const total = gymMembershipCost(cost, friends);
            document.getElementById('gymResult').textContent = `Total Cost: $${total.toFixed(2)}`;
        }

        // 5) Earthquake Damage
        function earthquakeDamage(intensity) {
            if (intensity < 5) return "Little or no damage";
            else if (intensity < 5.5) return "Some damage";
            else if (intensity < 6.5) return "Serious damage: walls may crack or fall";
            else if (intensity < 7.5) return "Disaster: buildings may collapse";
            else return "Catastrophe: most buildings destroyed";
        }
        function calculateDamage() {
            const intensity = parseFloat(document.getElementById('quakeIntensity').value);
            const result = earthquakeDamage(intensity);
            document.getElementById('quakeResult').textContent = `Damage Level: ${result}`;
        }
    </script>
</body>
</html>
